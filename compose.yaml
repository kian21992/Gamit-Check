services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gamit_check
      POSTGRES_USER: gamit_check
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - gamit_check_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamit_check -d gamit_check"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://gamit_check:${POSTGRES_PASSWORD}@database:5432/gamit_check
      DATABASE_SSL: "false"
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  gamit_check_data:
